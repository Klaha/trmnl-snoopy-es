name: Daily strip

on:
  schedule:
    # 06:00 UTC (08:00 in Spain): the day's strip is already up on GoComics.
    - cron: "0 6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch and process today's strip
        run: |
          mkdir -p site
          # Surface the error as an annotation so it shows on the run summary.
          python snoopy.py --out site/strip.png --json site/strip.json 2> error.txt \
            || { cat error.txt; echo "::error::$(tail -n 1 error.txt)"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Tell TRMNL there is a new strip
        env:
          TRMNL_WEBHOOK_URL: ${{ secrets.TRMNL_WEBHOOK_URL }}
        if: env.TRMNL_WEBHOOK_URL != ''
        run: |
          curl --fail-with-body -sS -X POST "$TRMNL_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"merge_variables\": $(cat site/strip.json)}"
